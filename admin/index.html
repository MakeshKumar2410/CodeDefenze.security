<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Codedefenze.security</title>
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <p class="eyebrow">Admin only</p>
      <h1>Codedefenze Admin</h1>
      <p style="color: var(--text-muted); margin-bottom: 1.25rem; font-size: 0.9rem;">
        Sign in to manage courses, resources, enrollments, messages, and testimonials.
      </p>
      <div id="alert" class="alert alert-error hidden"></div>
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" required autofocus />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
          Log In
        </button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById('login-form')
    const alertBox = document.getElementById('alert')

    // If already logged in, skip straight to the dashboard.
    api.me().then(() => { window.location.href = 'dashboard.html' }).catch(() => {})

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      alertBox.classList.add('hidden')
      const email = document.getElementById('email').value
      const password = document.getElementById('password').value
      try {
        await api.login(email, password)
        window.location.href = 'dashboard.html'
      } catch (err) {
        alertBox.textContent = err.message || 'Login failed.'
        alertBox.classList.remove('hidden')
      }
    })
  </script>
</body>
</html>
